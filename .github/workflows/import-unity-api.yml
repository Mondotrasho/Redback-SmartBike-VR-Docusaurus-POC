name: Import Unity API Documentation

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Public repository containing the generated DocFX documentation.
  SOURCE_REPOSITORY: Mondotrasho/UnityDocumentationTest

  # Branch containing the generated DocFX Markdown.
  SOURCE_BRANCH: api-docs

  # Directory inside SOURCE_BRANCH containing the documentation.
  # The api-docs branch currently stores the generated files at its root.
  SOURCE_DIR: .

  # Destination inside this documentation repository.
  OUTPUT_DIR: docs/unity-api

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      # Checkout this private documentation repository.
      - name: Checkout documentation repository
        uses: actions/checkout@v4
        with:
          path: docs-site

      # Checkout the public generated documentation branch.
      - name: Checkout generated Unity API documentation
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_BRANCH }}
          path: unity-api-source

      # Run our own import/normalisation script.
      #
      # This keeps formatting logic out of the GitHub Actions YAML so the
      # exact same import can be tested locally.
      - name: Import and normalise Unity API documentation
        working-directory: docs-site
        shell: bash
        run: |
          python scripts/documentation-import/normalize_docfx.py \
            --input "../unity-api-source/${SOURCE_DIR}" \
            --output "${OUTPUT_DIR}"

      # Useful during development so we can see exactly what was imported.
      - name: Show imported files
        working-directory: docs-site
        shell: bash
        run: |
          echo "Imported documentation:"
          find "${OUTPUT_DIR}" -type f | sort

      # Commit only if the generated documentation actually changed.
      - name: Commit imported documentation
        working-directory: docs-site
        shell: bash
        run: |
          git config user.name "docs-import-bot"
          git config user.email "docs-import-bot@users.noreply.github.com"

          git add "${OUTPUT_DIR}"

          if git diff --cached --quiet; then
            echo "No documentation changes."
            exit 0
          fi

          git commit -m "docs: import Unity API documentation"
          git push
