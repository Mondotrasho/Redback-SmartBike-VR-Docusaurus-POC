name: Import Unity API Documentation

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Public repository containing the generated DocFX documentation.
  SOURCE_REPOSITORY: Mondotrasho/Redback-SmartBike-VR-DocFX-POC

  # Branch containing the generated DocFX Markdown.
  SOURCE_BRANCH: api-docs

  # Import the complete generated branch output used by this POC.
  SOURCE_DIR: .

  # Destination inside this documentation repository.
  OUTPUT_DIR: docs/unity-api

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      # Checkout the documentation repository that receives the generated files.
      - name: Checkout documentation repository
        uses: actions/checkout@v4
        with:
          path: docs-site

      # Checkout the public generated documentation branch.
      - name: Checkout generated Unity API documentation
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_BRANCH }}
          path: unity-api-source

      # Replace the generated API documentation with the latest copy
      # from the Unity project's public api-docs branch.
      - name: Import Unity API documentation
        working-directory: docs-site
        shell: bash
        run: |
          echo "Source repository: ${SOURCE_REPOSITORY}"
          echo "Source branch:     ${SOURCE_BRANCH}"
          echo "Source directory:  ${SOURCE_DIR}"
          echo "Output directory:  ${OUTPUT_DIR}"

          rm -rf "${OUTPUT_DIR}"
          mkdir -p "${OUTPUT_DIR}"

          cp -R "../unity-api-source/${SOURCE_DIR}/." "${OUTPUT_DIR}/"

          # Never copy the source repository's Git metadata.
          rm -rf "${OUTPUT_DIR}/.git"

      # Keep the imported file list visible in the Action log while
      # this remains a proof of concept.
      - name: Show imported files
        working-directory: docs-site
        shell: bash
        run: |
          echo "Imported documentation:"
          find "${OUTPUT_DIR}" -type f | sort

      # Commit only when the generated documentation actually changed.
      - name: Commit imported documentation
        working-directory: docs-site
        shell: bash
        run: |
          git config user.name "docs-import-bot"
          git config user.email "docs-import-bot@users.noreply.github.com"

          git add "${OUTPUT_DIR}"

          if git diff --cached --quiet; then
            echo "No documentation changes."
            exit 0
          fi

          git commit -m "docs: import Unity API documentation"
          git push
